<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Congresos G2</title>
<meta name="theme-color" content="#16354D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16354D; --navy2:#0F2339; --cream:#F3F7F0; --cream2:#E8EDE5;
  --line:#D9E1DC; --grape:#AB92BF; --grape2:#8E6FA6; --white:#FFFFFF;
  --text:#3C4448; --muted:#7C8A8B; --radius:10px; --tr:.18s ease;
  --ok:#2A6B41; --ok-bg:#E4F0E7; --ok-b:#C6DFCC;
  --warn:#8A5F1A; --warn-bg:#F5EDDD; --warn-b:#E8D6AF;
  --err:#A6392F; --err-bg:#F6E4E2; --err-b:#EAC3BE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif; color:var(--text);
  min-height:100vh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 1px 1px, rgba(22,53,77,.07) 1px, transparent 0) 0 0/22px 22px,
    var(--cream2);
}
h1,h2,h3{font-family:'Playfair Display',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
svg{display:block;}
.icon-svg svg{width:100%;height:100%;}

#app{
  width:100%; max-width:440px; min-height:100vh; background:var(--cream);
  display:flex; flex-direction:column; position:relative; overflow:hidden;
}
@media(min-width:500px){
  body{padding:26px 0;}
  #app{min-height:calc(100vh - 52px); max-height:900px; border:1px solid var(--line);}
}

.topbar{
  background:linear-gradient(135deg, var(--navy) 0%, var(--navy2) 65%, #2c2450 130%);
  color:var(--white); padding:18px 20px 20px; position:relative; flex-shrink:0; overflow:hidden;
  border-bottom:2px solid var(--grape);
}
.topbar::before{
  content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.16) 1px, transparent 0);
  background-size: 16px 16px;
}
.topbar::after{
  content:""; position:absolute; width:180px; height:180px; border-radius:50%; pointer-events:none;
  background: radial-gradient(circle, var(--grape) 0%, transparent 70%); opacity:.35;
  top:-90px; right:-60px;
}
.topbar-row{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
.topbar-row img{height:30px; object-fit:contain;}
.logo-fallback{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em;
  border:1px solid rgba(255,255,255,.4); padding:5px 9px; border-radius:6px; color:#fff; white-space:nowrap;
}
.topbar-title{flex:1; min-width:0;}
.topbar-title .sig{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--grape); font-weight:500;}
.topbar-title h1{font-size:16.5px; font-weight:700; line-height:1.25; margin-top:3px; font-family:'Inter',sans-serif;}
.topbar-meta{margin-top:12px; font-size:12px; color:rgba(255,255,255,.72); display:flex; gap:16px; flex-wrap:wrap; position:relative; z-index:1;}
.topbar-meta span{display:inline-flex; align-items:center; gap:5px;}
.topbar-meta .icon-svg{width:13px;height:13px;opacity:.85;}
.install-btn{
  background:transparent; color:var(--white); border:1px solid rgba(255,255,255,.35); border-radius:6px;
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500; padding:7px 10px;
  cursor:pointer; white-space:nowrap; display:none; letter-spacing:.02em;
}
.install-btn.show{display:inline-block;}
.install-btn:hover{border-color:var(--grape); color:var(--grape);}

.screen{flex:1; overflow-y:auto; padding:18px 18px 90px; display:none;}
.screen.active{display:block;}

.section-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:500; margin:20px 0 10px; display:flex; align-items:center; gap:8px;}
.section-label:first-child{margin-top:0;}
.section-label::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--grape); flex-shrink:0;}
.section-label::after{content:""; flex:1; height:1px; background:var(--line);}

.tools-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.tool-card{
  background:var(--white); border-radius:var(--radius); padding:14px; cursor:pointer; transition:var(--tr);
  border:1px solid var(--line); position:relative; overflow:hidden;
}
.tool-card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:3px; transform:scaleX(0); transform-origin:left;
  background:var(--grape); transition:var(--tr);
}
.tool-card:hover{border-color:var(--navy); box-shadow:0 6px 16px rgba(22,53,77,.1);}
.tool-card:hover::before{transform:scaleX(1);}
.tool-card.featured{grid-column:1 / -1; display:flex; align-items:center; gap:14px; border-color:var(--navy); background:linear-gradient(120deg, var(--navy) 0%, var(--navy2) 100%); color:#fff;}
.tool-card.featured h3{color:#fff;}
.tool-card.featured p{color:rgba(255,255,255,.68);}
.tool-card.featured .icon-badge{margin-bottom:0; width:40px; height:40px; padding:9px; flex-shrink:0; background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.25); color:#fff;}
.tool-card.featured::before{display:none;}
.icon-badge{
  width:32px; height:32px; border:1px solid var(--line); border-radius:8px; color:var(--navy);
  display:flex; align-items:center; justify-content:center; margin-bottom:12px; padding:7px;
  background:rgba(22,53,77,.05);
}
.icon-badge.tint-grape{ background:rgba(171,146,191,.16); color:var(--grape2); border-color:rgba(171,146,191,.35); }
.tool-card h3{font-size:13.5px; color:var(--navy); font-weight:600; margin-bottom:4px; font-family:'Inter',sans-serif;}
.tool-card p{font-size:11px; color:var(--muted); line-height:1.4;}

.hero-card{
  background:var(--white); border-radius:var(--radius); margin-bottom:4px;
  border:1px solid var(--line); overflow:hidden;
}
.hero-banner{
  height:88px; position:relative; overflow:hidden;
  background:linear-gradient(120deg, var(--navy) 0%, var(--grape2) 100%);
}
.hero-banner img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-banner::after{
  content:""; position:absolute; inset:0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.22) 1px, transparent 0);
  background-size:14px 14px;
}
.hero-body{padding:16px 18px 18px;}
.logos{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
.logos img{height:22px; object-fit:contain;}
.logos .logo-fallback{color:var(--navy); border-color:var(--line);}
.hero-card h2{font-size:16px; color:var(--navy); line-height:1.32; margin-bottom:10px; font-weight:700;}
.chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--cream); color:var(--navy);
  border:1px solid var(--line); font-size:11px; font-weight:500; padding:5px 9px; border-radius:6px; margin-right:6px; margin-top:4px;
}
.chip .icon-svg{width:13px;height:13px;}

.status-chip{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:500; letter-spacing:.02em; padding:3px 7px; border-radius:4px; display:inline-block;}
.status-eval{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-b);}
.status-ok{background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok-b);}
.status-err{background:var(--err-bg); color:var(--err); border:1px solid var(--err-b);}

.notif-item{
  background:var(--white); border-radius:8px; padding:13px 14px; margin-bottom:9px;
  border:1px solid var(--line); border-left:3px solid var(--navy);
}
.notif-item h4{font-size:13px; color:var(--navy); margin-bottom:4px; font-weight:600;}
.notif-item p{font-size:12px; color:var(--text); line-height:1.45;}
.notif-item time{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted); display:block; margin-top:7px; letter-spacing:.02em;}
.note-box{
  background:var(--white); border:1px dashed var(--line); border-radius:8px; padding:12px 14px; font-size:11px;
  color:var(--muted); line-height:1.5; margin-top:16px;
}
.note-box::before{content:"→ "; font-family:'IBM Plex Mono',monospace; color:var(--grape);}

.info-row{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
.info-row .k{width:88px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); font-weight:500; flex-shrink:0; text-transform:uppercase; letter-spacing:.04em;}
.info-row .v{font-size:13px; color:var(--navy); font-weight:500;}
.info-row a{color:var(--navy);}

#overlay{
  position:absolute; inset:0; background:var(--white); z-index:40;
  display:none; flex-direction:column;
}
#overlay.active{display:flex;}
.overlay-bar{
  background:var(--navy); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  border-bottom:2px solid var(--grape);
}
.overlay-bar button.back{
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; width:30px; height:30px; border-radius:7px;
  font-size:15px; cursor:pointer;
}
.overlay-bar .t{flex:1; font-size:13px; font-weight:600;}
.overlay-bar a.ext{color:var(--grape); font-size:11px; text-decoration:none; white-space:nowrap; font-family:'IBM Plex Mono',monospace;}
#overlay iframe{flex:1; border:none; width:100%;}

.field label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; font-weight:500; color:var(--navy); display:block; margin-bottom:5px;}
.field input{
  width:100%; border:1px solid var(--line); background:var(--cream); border-radius:7px;
  padding:11px 12px; font-size:14px; font-family:'IBM Plex Mono',monospace; color:var(--text); letter-spacing:.02em;
}
.field input:focus{outline:none; border-color:var(--grape);}
.btn-primary{
  background:linear-gradient(120deg, var(--navy) 0%, var(--navy2) 100%); color:#fff; border:none; border-radius:7px; padding:12px; font-size:13px;
  font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; width:100%; margin-top:12px;
  box-shadow:0 4px 12px rgba(22,53,77,.22); transition:var(--tr);
}
.btn-primary:not(:disabled):hover{box-shadow:0 6px 16px rgba(22,53,77,.3); transform:translateY(-1px);}
.btn-primary:disabled{opacity:.5; cursor:default;}

nav.bottomnav{
  position:absolute; left:0; right:0; bottom:0; background:var(--white);
  border-top:1px solid var(--line); display:flex; z-index:20;
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottomnav button{
  flex:1; background:none; border:none; padding:11px 4px 9px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-family:'IBM Plex Mono',monospace;
}
nav.bottomnav button .ic{width:19px; height:19px;}
nav.bottomnav button .lb{font-size:9.5px; font-weight:500; letter-spacing:.03em; text-transform:uppercase;}
nav.bottomnav button .ic{border-radius:8px; padding:3px; transition:var(--tr);}
nav.bottomnav button.active{color:var(--navy); position:relative;}
nav.bottomnav button.active .ic{background:rgba(171,146,191,.18); color:var(--grape2);}
nav.bottomnav button.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:16px;height:2px;background:var(--grape);}

#loadingScreen{position:fixed; inset:0; background:var(--cream); display:flex; align-items:center; justify-content:center; z-index:100; flex-direction:column; gap:10px;}
#loadingScreen.hide{display:none;}
#loadingScreen .dot{width:8px;height:8px;background:var(--grape);border-radius:50%;animation:pulse 1s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
#errorScreen{position:fixed; inset:0; background:var(--cream); display:none; align-items:center; justify-content:center; z-index:100; padding:30px; text-align:center;}
#errorScreen.show{display:flex;}
</style>
</head>
<body>

<div id="loadingScreen"><div class="dot"></div><span class="mono" style="font-size:11px;color:var(--muted);">Cargando congreso…</span></div>
<div id="errorScreen"><div class="mono" style="font-size:12px;color:var(--muted);">No pudimos cargar la información del congreso. Verificá tu conexión y volvé a intentar.</div></div>

<div id="app" style="display:none;">

  <div class="topbar">
    <div class="topbar-row">
      <img id="topLogo" src="" alt="logo congreso" onerror="logoFallback(this)">
      <div class="topbar-title">
        <div class="sig" id="topSig"></div>
        <h1 id="topNombre"></h1>
      </div>
      <button class="install-btn" id="installBtn">+ Instalar</button>
    </div>
    <div class="topbar-meta">
      <span data-ic="calendar"><span id="topFechas"></span></span>
      <span data-ic="pin"><span id="topSede"></span></span>
    </div>
  </div>

  <div class="screen active" id="screen-home">
    <div class="section-label">Herramientas</div>
    <div class="tools-grid" id="toolsGrid"></div>

    <div class="note-box" id="homeNote"></div>
  </div>

  <div class="screen" id="screen-notif">
    <div class="section-label">Notificaciones</div>
    <div id="notifList"></div>
    <div class="note-box">
      Demo con avisos de ejemplo. En producción se envían como push notifications reales (requiere permiso del usuario).
    </div>
  </div>

  <div class="screen" id="screen-info">
    <div class="section-label">Organiza</div>
    <div class="logos" id="orgLogos" style="margin-bottom:18px;"></div>

    <div class="section-label">Información general</div>
    <div id="infoList"></div>
    <div class="note-box" id="infoNote"></div>
  </div>

  <div id="overlay">
    <div class="overlay-bar">
      <button class="back" id="overlayBack">←</button>
      <div class="t" id="overlayTitle"></div>
      <a class="ext" id="overlayExt" href="#" target="_blank" rel="noopener">abrir ↗</a>
    </div>
  </div>

  <nav class="bottomnav">
    <button data-screen="home" class="navbtn active"><span class="ic" data-ic="home"></span><span class="lb">Inicio</span></button>
    <button data-screen="notif" class="navbtn"><span class="ic" data-ic="bell"></span><span class="lb">Avisos</span></button>
    <button data-screen="info" class="navbtn"><span class="ic" data-ic="info"></span><span class="lb">Info</span></button>
  </nav>

</div>

<script>
/* ============================================================
   ID DEL CONGRESO A MOSTRAR
   -> Se toma de la URL: index.html?congreso=sagg-2026
   -> Así una misma app sirve a cualquier evento cargado en el backend.
   ============================================================ */
const CONGRESO_ID = new URLSearchParams(location.search).get("congreso") || "sagg-2026";

const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.3V19a1 1 0 0 0 1 1h3.3v-5.3h3.4V20H17a1 1 0 0 0 1-1v-8.7"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.7" r=".9" fill="currentColor" stroke="none"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3H14l4.5 4.5V20a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4.5h4.5"/><path d="M9 13h6M9 16.5h6"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5 6-2.5v14.5l-6 2.5-6-2.5-6 2.5z"/><line x1="9" y1="4" x2="9" y2="18.5"/><line x1="15" y1="6.5" x2="15" y2="21"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="18" y1="20" x2="18" y2="15"/></svg>',
  idcard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="1.8"/><circle cx="8.3" cy="11" r="1.8"/><line x1="13" y1="10" x2="18" y2="10"/><line x1="13" y1="14" x2="18" y2="14"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="1.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>'
};
function paintIcons(root){
  (root || document).querySelectorAll("[data-ic]").forEach(el => {
    if (!el.querySelector("svg")) el.insertAdjacentHTML("afterbegin", ICONS[el.dataset.ic] || "");
  });
}
let CONFIG = null;
function logoFallback(el){
  const span = document.createElement("span");
  span.className = "logo-fallback mono";
  span.textContent = (CONFIG?.sigla || "LOGO").replace(/\s?\d{4}$/, "");
  el.replaceWith(span);
}

/* ============================================================
   BOOT — trae la config del congreso desde el backend
   ============================================================ */
async function boot(){
  try {
    const res = await fetch(`/api/congresos/${encodeURIComponent(CONGRESO_ID)}`);
    if (!res.ok) throw new Error("congreso no encontrado");
    CONFIG = await res.json();
    renderAll();
    document.getElementById("loadingScreen").classList.add("hide");
    document.getElementById("app").style.display = "flex";
  } catch (err) {
    document.getElementById("loadingScreen").classList.add("hide");
    document.getElementById("errorScreen").classList.add("show");
  }
}

function renderAll(){
  document.getElementById("topLogo").src = CONFIG.logo || "";
  document.getElementById("topSig").textContent = CONFIG.sigla || "";
  document.getElementById("topNombre").textContent = CONFIG.nombre || "";
  document.getElementById("topFechas").textContent = CONFIG.fechas || "";
  document.getElementById("topSede").textContent = CONFIG.sede || "";
  document.getElementById("orgLogos").innerHTML = (CONFIG.logosOrganizadores || []).map(u => `<img src="${u}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-fallback mono',textContent:'LOGO'}))">`).join("");
  document.getElementById("homeNote").textContent = `Contenido cargado en vivo desde el panel de administración — congreso: ${CONGRESO_ID}.`;

  document.getElementById("toolsGrid").innerHTML = (CONFIG.herramientas || []).map((t, i) => `
    <div class="tool-card ${t.destacado ? "featured" : ""}" onclick="openTool('${t.id}')">
      <div class="icon-badge icon-svg ${!t.destacado && i % 2 ? "tint-grape" : ""}">${ICONS[t.icono] || ""}</div>
      <div>
        <h3>${t.titulo}</h3>
        <p>${t.descripcion}</p>
      </div>
    </div>`).join("");

  document.getElementById("notifList").innerHTML = (CONFIG.notificacionesDemo || []).map(n => `
    <div class="notif-item">
      <h4>${n.titulo}</h4>
      <p>${n.cuerpo}</p>
      <time>${n.fecha}</time>
    </div>
  `).join("");

  document.getElementById("infoList").innerHTML = (CONFIG.info || []).map(r => `
    <div class="info-row">
      <div class="k">${r.k}</div>
      <div class="v">${r.link ? `<a href="${r.link}" target="_blank" rel="noopener">${r.v}</a>` : r.v}</div>
    </div>
  `).join("");
  document.getElementById("infoNote").textContent = "Esta sección también puede alojar auspiciantes, hoteles recomendados, transporte, o cualquier información fija del congreso.";

  paintIcons();
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function showScreen(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.screen === name));
}
document.querySelectorAll(".navbtn").forEach(b => b.addEventListener("click", () => showScreen(b.dataset.screen)));

function clearOverlayContent(){
  const ov = document.getElementById("overlay");
  ov.querySelector("iframe")?.remove();
  ov.querySelectorAll(".overlay-native, .overlay-img").forEach(d => d.remove());
  return ov;
}

/* ============================================================
   ENCUESTA (demo — resultados solo locales por ahora)
   ============================================================ */
let encuestaVotada = false;
function renderEncuestaHTML(){
  const op = CONFIG.encuestaDemo?.opciones || [];
  const total = op.reduce((s, o) => s + o.votos, 0);
  if (!encuestaVotada){
    return `
      <div class="hero-card">
        <h3 style="color:var(--navy);font-size:15px;margin-bottom:14px;">${CONFIG.encuestaDemo?.pregunta || ""}</h3>
        ${op.map((o, i) => `<button class="btn-primary" style="margin-top:0;margin-bottom:8px;background:var(--white);color:var(--navy);border:1px solid var(--line);" onclick="votar(${i})">${o.texto}</button>`).join("")}
      </div>
      <div class="note-box">Encuesta en vivo: los resultados se actualizan en tiempo real para todos los asistentes conectados.</div>`;
  }
  return `
    <div class="hero-card">
      <h3 style="color:var(--navy);font-size:15px;margin-bottom:14px;">${CONFIG.encuestaDemo?.pregunta || ""}</h3>
      ${op.map(o => {
        const pct = total ? Math.round((o.votos / total) * 100) : 0;
        return `
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--navy);font-weight:600;margin-bottom:4px;">
              <span>${o.texto}</span><span class="mono">${pct}%</span>
            </div>
            <div style="background:var(--cream2);border-radius:4px;overflow:hidden;height:8px;">
              <div style="background:var(--grape);width:${pct}%;height:100%;"></div>
            </div>
          </div>`;
      }).join("")}
      <p class="mono" style="font-size:10.5px;color:var(--muted);margin-top:4px;">${total} votos totales</p>
    </div>`;
}
function votar(i){
  if (encuestaVotada) return;
  CONFIG.encuestaDemo.opciones[i].votos++;
  encuestaVotada = true;
  openTool("encuestas");
}

/* ============================================================
   CREDENCIAL DIGITAL — valida contra el backend (/roster/validar)
   ============================================================ */
function credencialFormHTML(){
  return `
    <div class="hero-card">
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;">Ingresá tu número de DNI (el mismo con el que te inscribiste) para generar tu credencial digital de acceso.</p>
      <div class="field">
        <label>DNI</label>
        <input type="text" inputmode="numeric" id="credencialDniInput" placeholder="Ej: 30111222" maxlength="10">
      </div>
      <button class="btn-primary" id="credencialBtn" onclick="buscarCredencial()">Validar y generar credencial</button>
    </div>
    <div id="credencialResultado"></div>
    <div class="note-box">Este listado de personas habilitadas se actualiza subiendo un Excel (DNI, Nombre, Categoría, Habilitado) desde el panel de administración.</div>`;
}

async function buscarCredencial(){
  const input = document.getElementById("credencialDniInput");
  const dni = (input.value || "").trim();
  const resultDiv = document.getElementById("credencialResultado");
  const btn = document.getElementById("credencialBtn");
  if (!dni){ resultDiv.innerHTML = ""; return; }

  btn.disabled = true; btn.textContent = "Validando…";
  let data;
  try {
    const res = await fetch(`/api/congresos/${encodeURIComponent(CONGRESO_ID)}/roster/validar?dni=${encodeURIComponent(dni)}`);
    data = await res.json();
  } catch (e) {
    resultDiv.innerHTML = `<div class="note-box">No pudimos validar tu DNI ahora mismo. Revisá tu conexión e intentá de nuevo.</div>`;
    btn.disabled = false; btn.textContent = "Validar y generar credencial";
    return;
  }
  btn.disabled = false; btn.textContent = "Validar y generar credencial";

  if (!data.found){
    resultDiv.innerHTML = `
      <div class="notif-item" style="border-left-color:var(--err);">
        <span class="status-chip status-err">NO ENCONTRADO</span>
        <p style="margin-top:8px;">No encontramos el DNI <b class="mono">${dni}</b> en el listado de inscriptos habilitados. Verificá que esté bien escrito o consultá con la organización.</p>
      </div>`;
    return;
  }
  if (!data.habilitado){
    resultDiv.innerHTML = `
      <div class="notif-item" style="border-left-color:var(--warn);">
        <span class="status-chip status-eval">PENDIENTE</span>
        <p style="margin-top:8px;">Hola ${data.nombre.split(" ")[0]}, tu inscripción figura registrada pero todavía no está habilitada para el ingreso. Consultá con la organización.</p>
      </div>`;
    return;
  }
  const qrData = encodeURIComponent(`${CONGRESO_ID}-${dni}`);
  resultDiv.innerHTML = `
    <div class="hero-card" style="text-align:center;">
      <span class="status-chip status-ok" style="margin-bottom:12px;display:inline-block;">ACCESO HABILITADO</span>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=16354D&data=${qrData}" style="width:170px;height:170px;border-radius:8px;margin:8px 0 14px;border:1px solid var(--line);" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'mono',style:'width:170px;height:170px;margin:8px auto 14px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);padding:10px;text-align:center;',textContent:'QR no disponible — código: ${CONGRESO_ID}-${dni}'}))">
      <h3 style="color:var(--navy);font-size:15px;margin-bottom:4px;">${data.nombre}</h3>
      <p class="mono" style="font-size:11px;color:var(--muted);">${data.categoria} · DNI ${dni}</p>
    </div>
    <div class="note-box">Este QR es el que escanearía el staff de acreditación en el ingreso y en el acceso a salas. Guardá una captura o dejá la app instalada para tenerlo siempre a mano, incluso sin conexión.</div>`;
}

/* ============================================================
   ABRIR HERRAMIENTA
   ============================================================ */
function openTool(id){
  const t = (CONFIG.herramientas || []).find(x => x.id === id);
  if (!t) return;

  if (t.modo === "nativo") { showScreen(t.target); return; }
  if (t.modo === "externo") { window.open(t.url, "_blank", "noopener"); return; }

  const ov = clearOverlayContent();
  document.getElementById("overlayTitle").textContent = t.titulo;
  const extLink = document.getElementById("overlayExt");

  if (t.modo === "credencial"){
    extLink.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = "overlay-native";
    wrap.style.cssText = "flex:1;overflow-y:auto;padding:18px;background:var(--cream);";
    wrap.innerHTML = credencialFormHTML();
    ov.appendChild(wrap);
    ov.classList.add("active");
    return;
  }

  if (t.modo === "nativo-overlay"){
    extLink.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = "overlay-native";
    wrap.style.cssText = "flex:1;overflow-y:auto;padding:18px;background:var(--cream);";
    if (id === "encuestas") wrap.innerHTML = renderEncuestaHTML();
    ov.appendChild(wrap);
    ov.classList.add("active");
    return;
  }

  if (t.modo === "imagen") {
    extLink.style.display = "";
    extLink.href = t.url;
    const img = document.createElement("div");
    img.className = "overlay-img";
    img.style.cssText = "flex:1;overflow:auto;background:var(--navy2);display:flex;align-items:flex-start;justify-content:center;padding:10px;";
    img.innerHTML = `<img src="${t.url}" style="max-width:100%;border-radius:6px;" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'mono',style:'color:#fff;padding:30px;text-align:center;font-size:12px;',textContent:'No se pudo cargar el plano. Verificá la URL configurada.'}))">`;
    ov.appendChild(img);
    ov.classList.add("active");
    return;
  }

  if (t.modo === "embed") {
    extLink.style.display = "";
    extLink.href = t.url;
    const frame = document.createElement("iframe");
    frame.id = "overlayFrame";
    frame.src = t.url;
    ov.appendChild(frame);
    ov.classList.add("active");
  }
}
document.getElementById("overlayBack").addEventListener("click", () => {
  document.getElementById("overlay").classList.remove("active");
});

/* ============================================================
   INSTALACIÓN PWA
   ============================================================ */
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").classList.add("show");
});
document.getElementById("installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("installBtn").classList.remove("show");
});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

boot();
</script>
</body>
</html>
